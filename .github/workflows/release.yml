name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version without the leading v, must match app/version.txt (for example 0.0.4)
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then wanted=$GITHUB_REF_NAME; else wanted=$INPUT_VERSION; fi
          python3 -I tools/version.py --selftest
          python3 -I tools/version.py "$wanted" > "$RUNNER_TEMP/version.out"
          cat "$RUNNER_TEMP/version.out"
          awk -F= '{ print toupper($1) "=" $2 }' "$RUNNER_TEMP/version.out" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Prepare signing
        env:
          KEYSTORE_BASE64: ${{ secrets.TVSIG_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.TVSIG_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TVSIG_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.TVSIG_KEY_PASSWORD }}
        run: |
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS; do
            if [[ -z ${!name} ]]; then
              echo "::error::The repository secret for $name is missing. See doc/guideline-release-signing.md."
              exit 1
            fi
          done
          mkdir -p app/signing
          echo "$KEYSTORE_BASE64" | base64 -d > app/signing/release.keystore
          {
            echo "storeFile=release.keystore"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          } > app/signing/release.properties

      - name: Build signed release APK and bundle
        run: ./gradlew assembleRelease bundleRelease --stacktrace

      - name: Check that the Gson classes keep their names
        run: python3 -I tools/check-keep-rules.py

      - name: Collect files
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk "dist/TVSig-$VERSION.apk"
          cp app/build/outputs/bundle/release/*.aab "dist/TVSig-$VERSION.aab"
          if [ -f app/build/outputs/mapping/release/mapping.txt ]; then
            cp app/build/outputs/mapping/release/mapping.txt "dist/TVSig-$VERSION-mapping.txt"
          fi
          (cd dist && sha256sum ./*.apk ./*.aab > SHA256SUMS.txt)

      - name: Check the APK
        env:
          EXPECTED_CERT_SHA256: ${{ secrets.TVSIG_RELEASE_CERT_SHA256 }}
        run: |
          tools/release-notes.sh facts "dist/TVSig-$VERSION.apk" | tee "$RUNNER_TEMP/facts.out"
          source "$RUNNER_TEMP/facts.out"
          fail() { echo "::error::$1"; exit 1; }
          [[ $PACKAGE_NAME == com.kutlusoy.tvsig ]] || fail "Unexpected application ID $PACKAGE_NAME"
          [[ $APK_VERSION_NAME == "$VERSION" ]] || fail "The APK says version $APK_VERSION_NAME but the release is $VERSION"
          [[ $APK_VERSION_CODE == "$VERSION_CODE" ]] || fail "The APK has version code $APK_VERSION_CODE but tools/version.py says $VERSION_CODE"
          [[ -n $CERT_SHA256 ]] || fail "No signing certificate found in the APK"
          if [[ -n $EXPECTED_CERT_SHA256 && $CERT_SHA256 != "$(echo "$EXPECTED_CERT_SHA256" | tr -d ':' | tr 'A-F' 'a-f')" ]]; then
            fail "The APK certificate $CERT_SHA256 does not match TVSIG_RELEASE_CERT_SHA256"
          fi

      - name: Check the proof for the Android developer verification
        run: |
          file=app/src/main/assets/adi-registration.properties
          if [[ ! -f $file ]]; then
            echo "::warning::$file is missing. The release cannot be used as proof of ownership for the Android developer verification, see doc/guideline-android-developer-verification.md."
          elif [[ $(tr -d '[:space:]' < $file | wc -c) -lt 8 || $(wc -c < $file) -gt 2000 ]]; then
            echo "::error::$file does not look like the snippet of the console."
            exit 1
          fi
          source <(tools/release-notes.sh facts "dist/TVSig-$VERSION.apk")
          if [[ -f $file && $ADI_FILE != yes ]]; then
            echo "::error::$file exists but is not part of the APK"
            exit 1
          fi

      - name: Release notes
        run: tools/release-notes.sh notes "dist/TVSig-$VERSION.apk" "dist/TVSig-$VERSION.aab" "$VERSION" "$GITHUB_SHA" > dist/NOTES.md

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

      - name: Create or update the release
        run: |
          flags=()
          [[ $PRERELEASE == true ]] && flags+=(--prerelease)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.apk dist/*.aab dist/*.txt --clobber
            gh release edit "$TAG" --title "TVSig v$VERSION" --notes-file dist/NOTES.md "${flags[@]}"
          else
            gh release create "$TAG" dist/*.apk dist/*.aab dist/*.txt \
              --target "$GITHUB_SHA" --title "TVSig v$VERSION" --notes-file dist/NOTES.md "${flags[@]}"
          fi
