name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version without the leading v, must match versionName in app/build.gradle (for example 0.0.1)
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then tag=$GITHUB_REF_NAME; else tag="v${INPUT_VERSION#v}"; fi
          version=${tag#v}
          if [[ ! $version =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Version '$version' is not of the form X.Y.Z or X.Y.Z-suffix"
            exit 1
          fi
          gradle_version=$(grep -oP 'versionName "\K[^"]+' app/build.gradle)
          if [[ $gradle_version != "$version" ]]; then
            echo "::error::Tag $tag does not match versionName $gradle_version in app/build.gradle"
            exit 1
          fi
          prerelease=false
          [[ $version == *-* ]] && prerelease=true
          {
            echo "TAG=$tag"
            echo "VERSION=$version"
            echo "PRERELEASE=$prerelease"
          } >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Prepare signing
        env:
          KEYSTORE_BASE64: ${{ secrets.TVSIG_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.TVSIG_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TVSIG_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.TVSIG_KEY_PASSWORD }}
        run: |
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS; do
            if [[ -z ${!name} ]]; then
              echo "::error::The repository secret for $name is missing. See doc/guideline-release-signing.md."
              exit 1
            fi
          done
          mkdir -p app/signing
          echo "$KEYSTORE_BASE64" | base64 -d > app/signing/release.keystore
          {
            echo "storeFile=release.keystore"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          } > app/signing/release.properties

      - name: Build signed release APK and bundle
        run: ./gradlew assembleRelease bundleRelease --stacktrace

      - name: Collect files
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk "dist/TvSig-$VERSION.apk"
          cp app/build/outputs/bundle/release/*.aab "dist/TvSig-$VERSION.aab"
          if [ -f app/build/outputs/mapping/release/mapping.txt ]; then
            cp app/build/outputs/mapping/release/mapping.txt "dist/TvSig-$VERSION-mapping.txt"
          fi
          (cd dist && sha256sum ./*.apk ./*.aab > SHA256SUMS.txt)

      - name: Check the signing certificate
        env:
          EXPECTED_CERT_SHA256: ${{ secrets.TVSIG_RELEASE_CERT_SHA256 }}
        run: |
          apksigner=$(ls "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --verbose --print-certs "dist/TvSig-$VERSION.apk" > "$RUNNER_TEMP/verify.txt"
          cert=$(sed -n 's/^.*[Ss]igner.*certificate SHA-256 digest: *//p' "$RUNNER_TEMP/verify.txt" | head -1 | tr -d ':' | tr 'A-F' 'a-f')
          echo "Signing certificate SHA-256: $cert"
          if [[ -z $cert ]]; then
            cat "$RUNNER_TEMP/verify.txt"
            echo "::error::No signing certificate found in the APK"
            exit 1
          fi
          if [[ -n $EXPECTED_CERT_SHA256 && $cert != "$(echo "$EXPECTED_CERT_SHA256" | tr -d ':' | tr 'A-F' 'a-f')" ]]; then
            echo "::error::The APK certificate $cert does not match TVSIG_RELEASE_CERT_SHA256"
            exit 1
          fi
          echo "CERT_SHA256=$cert" >> "$GITHUB_ENV"

      - name: Release notes
        run: |
          {
            echo "TvSig v$VERSION"
            echo
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| Application ID | com.kutlusoy.tvsig |"
            echo "| Version | $VERSION |"
            echo "| Signing certificate SHA-256 | $CERT_SHA256 |"
            echo
            echo "Files:"
            echo
            echo "- \`TvSig-$VERSION.apk\`: the app, install this file on the device"
            echo "- \`TvSig-$VERSION.aab\`: app bundle for store uploads"
            echo "- \`TvSig-$VERSION-mapping.txt\`: R8 mapping to read crash traces"
            echo "- \`SHA256SUMS.txt\`: checksums of the files"
            echo
            echo "Verify a download with \`sha256sum -c SHA256SUMS.txt\`, and compare the signing certificate with \`apksigner verify --print-certs <apk>\`."
          } > dist/NOTES.md

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

      - name: Create or update the release
        run: |
          flags=()
          [[ $PRERELEASE == true ]] && flags+=(--prerelease)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.apk dist/*.aab dist/*.txt --clobber
            gh release edit "$TAG" --title "TvSig v$VERSION" --notes-file dist/NOTES.md "${flags[@]}"
          else
            gh release create "$TAG" dist/*.apk dist/*.aab dist/*.txt \
              --target "$GITHUB_SHA" --title "TvSig v$VERSION" --notes-file dist/NOTES.md "${flags[@]}"
          fi
