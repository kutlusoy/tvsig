<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TVSig Einrichtung</title>
<style>
  :root { color-scheme: light dark; --bg:#f6f7fb; --card:#fff; --text:#1a1a1a; --muted:#666; --line:#d5d8e2; --primary:#114fee; --ok:#0a7d33; --err:#c62828; }
  @media (prefers-color-scheme: dark) { :root { --bg:#12131a; --card:#1c1e28; --text:#f0f1f6; --muted:#a0a4b5; --line:#353849; --primary:#7a9bff; --ok:#5fd68a; --err:#ff7b7b; } }
  * { box-sizing: border-box; }
  body { margin:0; padding:16px; background:var(--bg); color:var(--text); font:16px/1.4 system-ui, sans-serif; }
  main { max-width:560px; margin:0 auto; }
  h1 { font-size:22px; margin:8px 0 16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:14px; }
  h2 { font-size:13px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); margin:0 0 12px; }
  label { display:block; font-weight:600; margin:12px 0 4px; }
  input, select { width:100%; padding:12px; font-size:16px; border:1px solid var(--line); border-radius:10px; background:var(--bg); color:var(--text); }
  button { padding:12px 16px; font-size:16px; border:0; border-radius:10px; background:var(--primary); color:#fff; font-weight:600; margin:8px 8px 0 0; }
  button.secondary { background:transparent; color:var(--primary); border:1px solid var(--primary); }
  button.wide { width:100%; margin:0; padding:15px; }
  .hint { color:var(--muted); font-size:14px; margin-top:4px; }
  .msg { margin-top:10px; font-weight:600; }
  .ok { color:var(--ok); } .err { color:var(--err); }
  .crumb { font-size:14px; color:var(--primary); margin:8px 0; word-break:break-all; }
  .folder { display:block; width:100%; text-align:left; margin:6px 0 0; background:var(--bg); color:var(--text); border:1px solid var(--line); font-weight:500; }
  .hidden { display:none; }
</style>
</head>
<body>
<main>
  <h1>TVSig einrichten</h1>

  <div class="card">
    <h2>Quelle</h2>
    <label for="source">Art der Quelle</label>
    <select id="source">
      <option value="0">Webserver</option>
      <option value="1">Google Drive</option>
    </select>

    <label for="base" id="baseLabel">Basis-URL</label>
    <input id="base" type="text" autocomplete="off" autocapitalize="off" spellcheck="false">
    <div class="hint" id="baseHint"></div>

    <label for="path">Ordner (Pfad)</label>
    <input id="path" type="text" autocomplete="off" autocapitalize="off" spellcheck="false">
    <button class="secondary" id="browse" type="button">Ordner auswählen</button>
    <button class="secondary" id="test" type="button">Verbindung testen</button>
    <div class="msg" id="testMsg"></div>

    <div id="browser" class="hidden">
      <div class="crumb" id="crumb"></div>
      <button id="useFolder" type="button">Diesen Ordner verwenden</button>
      <button class="secondary" id="upFolder" type="button">Eine Ebene höher</button>
      <div id="folders"></div>
      <div class="hint" id="browserMsg"></div>
    </div>
  </div>

  <div class="card">
    <h2>Wiedergabe</h2>
    <label for="delay">Anzeigedauer pro Bild</label>
    <select id="delay"></select>
    <label for="transition">Übergangseffekt</label>
    <select id="transition"></select>
  </div>

  <div class="card">
    <h2>Anzeige</h2>
    <label for="orientation">Bildschirmausrichtung</label>
    <select id="orientation">
      <option value="-1">Automatisch (nur Handy und Tablet)</option>
      <option value="0">Querformat</option>
      <option value="90">90° gedreht</option>
      <option value="180">180° gedreht</option>
      <option value="270">270° gedreht</option>
    </select>
  </div>

  <button class="wide" id="save" type="button">Auf dem Fernseher speichern</button>
  <div class="msg" id="saveMsg"></div>
</main>

<script>
var token = new URLSearchParams(location.search).get('t') || '';
var MAX_DEPTH = 5;
var path = '';
var state = {};

function el(id) { return document.getElementById(id); }

function api(method, url, body) {
  var options = { method: method, headers: { 'X-Token': token } };
  if (body) { options.body = JSON.stringify(body); options.headers['Content-Type'] = 'application/json'; }
  return fetch(url, options).then(function (r) { return r.json(); });
}

function sourceType() { return parseInt(el('source').value, 10); }

function query(extraPath) {
  return 'type=' + sourceType() + '&base=' + encodeURIComponent(el('base').value.trim()) + '&path=' + encodeURIComponent(extraPath);
}

function segments(p) { return p.split('/').map(function (s) { return s.trim(); }).filter(Boolean); }

function updateLabels() {
  var drive = sourceType() === 1;
  el('baseLabel').textContent = drive ? 'ID des Drive-Hauptordners' : 'Basis-URL des Webservers';
  el('baseHint').textContent = drive ? 'Die ID steht im Ordnerlink hinter /folders/. Der ganze Link geht auch.' : 'z. B. https://example.com/signage';
  el('base').value = drive ? (state.driveId || '') : (state.baseUrl || '');
  el('path').value = drive ? (state.drivePath || '') : (state.subfolder || '');
}

function rememberFields() {
  if (sourceType() === 1) { state.driveId = el('base').value; state.drivePath = el('path').value; }
  else { state.baseUrl = el('base').value; state.subfolder = el('path').value; }
}

var currentType = 0;
el('source').addEventListener('change', function () {
  var next = sourceType();
  var save = state;
  if (currentType === 1) { save.driveId = el('base').value; save.drivePath = el('path').value; }
  else { save.baseUrl = el('base').value; save.subfolder = el('path').value; }
  currentType = next;
  updateLabels();
  el('browser').classList.add('hidden');
  el('testMsg').textContent = '';
});

el('test').addEventListener('click', function () {
  var msg = el('testMsg');
  msg.className = 'msg'; msg.textContent = 'Teste …';
  api('GET', '/api/test?' + query(el('path').value.trim())).then(function (r) {
    if (r.ok) { msg.className = 'msg ok'; msg.textContent = (r.images + r.videos) + ' Dateien gefunden (' + r.images + ' Bilder, ' + r.videos + ' Videos)'; }
    else { msg.className = 'msg err'; msg.textContent = 'Fehlgeschlagen: ' + (r.error || ''); }
  }).catch(function () { msg.className = 'msg err'; msg.textContent = 'Keine Verbindung zum Fernseher'; });
});

function showFolders() {
  el('crumb').textContent = ['Hauptordner'].concat(segments(path)).join(' / ');
  el('upFolder').classList.toggle('hidden', segments(path).length === 0);
  var list = el('folders'); list.textContent = '';
  var msg = el('browserMsg'); msg.textContent = 'Lade …';
  if (segments(path).length >= MAX_DEPTH) { msg.textContent = 'Größte Tiefe erreicht (' + MAX_DEPTH + ' Ebenen)'; return; }
  api('GET', '/api/folders?' + query(path)).then(function (r) {
    if (!r.ok) { msg.textContent = 'Ordner konnten nicht geladen werden: ' + (r.error || ''); return; }
    msg.textContent = r.folders.length ? '' : 'Keine weiteren Unterordner';
    r.folders.forEach(function (name) {
      var b = document.createElement('button');
      b.className = 'folder'; b.type = 'button'; b.textContent = '› ' + name;
      b.addEventListener('click', function () { path = segments(path).concat([name]).join('/'); showFolders(); });
      list.appendChild(b);
    });
  }).catch(function () { msg.textContent = 'Keine Verbindung zum Fernseher'; });
}

el('browse').addEventListener('click', function () {
  if (!el('base').value.trim()) { el('testMsg').className = 'msg err'; el('testMsg').textContent = 'Bitte zuerst die Quelle eintragen'; return; }
  path = '';
  el('browser').classList.remove('hidden');
  showFolders();
});
el('upFolder').addEventListener('click', function () { path = segments(path).slice(0, -1).join('/'); showFolders(); });
el('useFolder').addEventListener('click', function () { el('path').value = path; el('browser').classList.add('hidden'); });

el('save').addEventListener('click', function () {
  var msg = el('saveMsg');
  rememberFields();
  var body = {
    sourceType: sourceType(),
    baseUrl: state.baseUrl || '', subfolder: state.subfolder || '',
    driveId: state.driveId || '', drivePath: state.drivePath || '',
    slideDelay: parseInt(el('delay').value, 10),
    transition: parseInt(el('transition').value, 10),
    orientation: parseInt(el('orientation').value, 10)
  };
  msg.className = 'msg'; msg.textContent = 'Speichere …';
  api('POST', '/api/save', body).then(function (r) {
    if (r.ok) { msg.className = 'msg ok'; msg.textContent = 'Gespeichert. Der Fernseher startet jetzt die Wiedergabe.'; }
    else { msg.className = 'msg err'; msg.textContent = 'Nicht gespeichert: ' + (r.error || ''); }
  }).catch(function () { msg.className = 'msg err'; msg.textContent = 'Keine Verbindung zum Fernseher'; });
});

var delays = [3, 5, 8, 10, 15, 20, 30, 45, 60, 90, 120, 180, 300];
var transitions = ['Keiner', 'Überblenden', 'Schieben nach links', 'Schieben nach rechts', 'Schieben nach oben', 'Schieben nach unten', 'Zoom hinein', 'Zoom heraus', 'Zufall'];
delays.forEach(function (s) { var o = document.createElement('option'); o.value = s; o.textContent = s + ' Sekunden'; el('delay').appendChild(o); });
transitions.forEach(function (t, i) { var o = document.createElement('option'); o.value = i; o.textContent = t; el('transition').appendChild(o); });

api('GET', '/api/state').then(function (s) {
  state = s;
  currentType = s.sourceType;
  el('source').value = s.sourceType;
  var nearest = delays.reduce(function (a, b) { return Math.abs(b - s.slideDelay) < Math.abs(a - s.slideDelay) ? b : a; });
  el('delay').value = nearest;
  el('transition').value = s.transition;
  el('orientation').value = s.orientation;
  updateLabels();
}).catch(function () { el('saveMsg').className = 'msg err'; el('saveMsg').textContent = 'Keine Verbindung zum Fernseher'; });
</script>
</body>
</html>
